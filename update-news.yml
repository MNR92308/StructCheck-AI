name: Update news (AI)

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 07:00 เวลาไทย ทุกวัน
  workflow_dispatch:       # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write

concurrency:
  group: news-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: AI ค้นข่าวและร่างสรุป
        run: node scripts/fetch-news.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'apodex/apodex-1.1-mini:free' }}
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Commit data/news.json
        run: |
          git config user.name "structcheck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || (git commit -m "chore(data): AI news scan $(date -u +%F)" && git push)
