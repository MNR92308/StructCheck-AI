name = "structcheck-ai"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# โดเมนของเว็บคุณ (ไม่ต้องมี / ท้าย และใส่เฉพาะ origin ไม่ใช่ path) คั่นหลายค่าด้วย ,
ALLOWED_ORIGINS = "https://ชื่อเจ้าของ.github.io"
MODEL = "claude-sonnet-5-5"

# จำกัดจำนวนครั้งต่อ IP (ไม่บังคับ แต่แนะนำ) ลบ 4 บรรทัดนี้ออกถ้าไม่ใช้
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
